[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trikaal"
version = "0.0.1"
description = "A microstructure-aware FSQ tokenizer for crypto K-line foundation models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Trikaal" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "mypy>=1.8",
]
# Real data pipeline (§2-§4). The synthetic slice (core) needs only numpy + torch.
data = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "certifi",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trikaal = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# E,F,W pyflakes/pycodestyle; I import-sort; B bugbear; UP pyupgrade; NPY numpy; RUF
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "E741",   # ambiguous var names (l, L are meaningful here: levels, length)
    "RUF002", # ambiguous unicode in docstrings (we use math symbols)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that touch real Parquet / long training (excluded from fast CI)",
    "gate: pre-flight G0/G1/G2 gate tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
