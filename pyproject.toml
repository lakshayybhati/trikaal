[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trikaal"
version = "0.0.1"
description = "A tokenizer study: microstructure-aware FSQ quantization for crypto K-lines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Trikaal" }]
# Exact pins (invariant 7): the Gate-A results_hash is only meaningful under a pinned env —
# floor-only constraints let numpy/torch drift twice and silently moved the anchor. The committed
# uv.lock is the full transitive pin; these two are the direct, drift-critical ones.
dependencies = [
    "numpy==2.4.6",
    "torch==2.12.1",
    "wandb==0.28.0",
]

[project.optional-dependencies]
# ★ EXACT, FOR THE SAME REASON THE RUNTIME PINS ARE EXACT — the comment above says floor-only
# constraints "let numpy/torch drift twice and silently moved the anchor", and then these three
# were left as floors. They drifted: `ruff>=0.5` resolves to 0.16.x under a plain `pip install`
# while uv.lock pins 0.15.18, and 0.16 formats Python inside markdown fences, so a contributor
# following the README got four lint failures the locked environment does not produce. A LINTER
# VERSION IS PART OF THE GATE, not a convenience.
dev = [
    "ruff==0.15.18",
    "pytest==9.1.1",
    "mypy==2.1.0",
]
# Real data pipeline (§2-§4). The synthetic slice (core) needs only numpy + torch.
data = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "certifi",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trikaal = ["py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
# E,F,W pyflakes/pycodestyle; I import-sort; B bugbear; UP pyupgrade; NPY numpy; RUF
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = [
    "E741",   # ambiguous var names (l, L are meaningful here: levels, length)
    "RUF002", # ambiguous unicode in docstrings (we use math symbols)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: ALWAYS print the reason for every skip in the summary. Eleven tests in the demo
# suite need the published weights, which a public clone does not have — without this the
# suite simply "greens out" in a thirtieth of the time and the strongest checks vanish
# silently. Their absence is now stated in the run summary rather than inferred from a
# count of "s" characters.
addopts = ["-rs"]
# The repo root must be importable: a few tests reuse fixtures from a sibling module via
# `from tests.eval.test_verdict import ...`. `python -m pytest` puts CWD on sys.path and the
# `pytest` console script does not, so without this the suite passed locally under one
# invocation and failed CI under the other — 88 consecutive red runs from a single import.
pythonpath = ["."]
markers = [
    "slow: tests that touch real Parquet / long training (excluded from fast CI)",
    "gate: pre-flight G0/G1/G2 gate tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
